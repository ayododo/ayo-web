<!-- ==========================================================================
     AYO — PadelLevels Rating
     Static markup. Paste into the page and load padellevels-rating.css.
     No JS: nothing here toggles or animates.

     The rating card is no longer markup. It is part of the illustration,
     exported from Figma as one asset, so the level, status, confidence and the
     bar are pixels — nothing here can be wired to real data. Changing any of
     those numbers means a new export, and the img's alt has to be changed to
     match. Re-export at 2× the panel (1158 × 782).
     ========================================================================== -->
<section class="plr" id="rating" aria-labelledby="plr-title">
  <div class="plr__shell">
    <div class="plr__board reveal">

      <div class="plr__header">
        <p class="plr__eyebrow">
          PadelLevels × AYO
        </p>
        <h2 class="plr__title" id="plr-title">Every player, one global rating.</h2>
      </div>

      <div class="plr__body">
        <div class="plr__gutter">
          <img class="plr__photo" src="../../assets/padellevels-panel.jpg"
               alt="PadelLevels Rating card: level 5.2 of 7.0, status calibrated, confidence 74%."
               width="579" height="391" loading="lazy">
        </div>

        <div class="plr__explain">
          <p class="plr__label">How it’s calculated</p>
          <p class="plr__copy">Your performance rating is calculated from match scores and the level of the opponents you face. Beating stronger players counts for more.</p>
              <a class="plr__cta" href="#">
                View your PadelLevels rating
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M8 16L16 8"/><path d="M9 8h7v7"/>
                </svg>
              </a>
        </div>
      </div>

    </div>
  </div>
</section>
