<!-- ==========================================================================
     AYO — PadelLevels Rating
     Static markup. Paste into the page and load padellevels-rating.css.
     No JS. The rating card is markup with sample numbers (level, status,
     confidence, ranking); wire them to real data when the API is available.
     ========================================================================== -->
<section class="plr" id="rating" aria-labelledby="plr-title">
  <div class="plr__shell">
    <div class="plr__board reveal">

      <header class="plr__head">
        <p class="plr__eyebrow">AYO × PadelLevels</p>
        <h2 class="plr__title" id="plr-title">Padel Player Ratings. Every match builds your level.</h2>
      </header>

      <div class="plr__body">
        <!-- Example rating card, built in markup so the numbers can later come
             from real data. Everything in it is sample content. -->
        <figure class="plr__card" aria-label="Example PadelLevels rating card">
          <div class="plr__card-top">
            <p class="plr__card-kicker">International Rating by PadelLevels</p>
            <svg class="plr__crown" viewBox="0 0 16 16" fill="#FDBE00" stroke="#FDBE00" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.33 13.67h9.34" fill="none"/><path d="M11.25 11.67h-6.5c-.68 0-1.03 0-1.29-.19-.26-.18-.37-.5-.6-1.15l-1.5-4.28a.67.67 0 0 1 1-.75l.82.54c.83.54 1.24.82 1.66.72.42-.1.67-.53 1.17-1.39l1.48-2.55a.58.58 0 0 1 1.01 0l1.48 2.55c.5.86.75 1.29 1.17 1.39.42.1.83-.18 1.66-.72l.82-.54a.67.67 0 0 1 1 .75l-1.5 4.28c-.23.65-.34.97-.6 1.15-.26.19-.6.19-1.29.19Z"/></svg>
          </div>

          <div class="plr__level">
            <div class="plr__level-row">
              <div class="plr__level-main">
                <svg class="plr__logo" viewBox="0 0 24 20" fill="#D83232" aria-hidden="true"><path fill-rule="evenodd" d="M12.7 14.38 21.82 1.87l-.88-.6-8.24 11.28-4.08-6.82L0 18.32 8.57 7.5l4.13 6.88Z"/><path fill-rule="evenodd" d="m12.7 18.73 8.98-12.4-.88-.6-8.1 11.17-4.08-6.83-6.52 8.06 6.47-6.29 4.13 6.89Z"/></svg>
                <span class="plr__level-val">3.1X</span>
                <span class="plr__status">Calibrating</span>
              </div>
              <div class="plr__conf">
                <span class="plr__muted">Confidence</span>
                <b>52%</b>
              </div>
            </div>
            <div class="plr__bar" role="img" aria-label="Confidence 52%"><i style="width:52%"></i></div>
            <div class="plr__links">
              <a class="plr__learn" href="#">Learn more</a>
              <a class="plr__view" href="#">View on PadelLevels
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h2c.94 0 1.41 0 1.7.29.3.3.3.77.3 1.71v2M13.33 2.67l-6 6"/><path d="M13.33 8.67c0 2.51 0 3.77-.78 4.55-.78.78-2.04.78-4.55.78h-.67c-2.51 0-3.77 0-4.55-.78C2 12.44 2 11.18 2 8.67V8c0-2.51 0-3.77.78-4.55.78-.78 2.04-.78 4.55-.78"/></svg>
              </a>
            </div>
          </div>

          <div class="plr__rank">
            <p class="plr__muted">Ranking</p>
            <ul class="plr__rank-row">
              <li><b>10</b><span><span aria-hidden="true">🇮🇩</span> Indonesia</span></li>
              <li><b>7</b><span>Jakarta Selatan</span></li>
              <li><b>1</b><span>Kemang Timur</span></li>
            </ul>
          </div>
        </figure>

        <div class="plr__explain">
          <p class="plr__label">How it’s calculated</p>
          <p class="plr__copy">Your rating is built from real matches you’ve actually played, no self-ratings. Find evenly matched games, get an accurate rating and watch your game evolve.</p>
        </div>
      </div>

    </div>
  </div>
</section>
